<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kuis - N3 文法</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <style>
        .select-container {
    max-width: 950;
    margin: 3rem auto;
    text-align: center;
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
}

.select-card {
    background: white;
    border-radius: 12px;
    padding: 0.8rem 1.5rem;
    height: 90px;
    width: 280px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    cursor: pointer;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    border-top: 4px solid #3498db;
}
.select-card.mc { border-top-color: #e74c3c; }
.select-card.gap { border-top-color: #27ae60; }
.select-card.kanji { border-top-color: #F3AD16; }
.select-card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
.select-card .emoji { font-size: 2rem; }
.select-card p { color: #7f8c8d; font-size: 0.85rem; }
.select-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .top-bar {
    width: 100%;
    margin: 0;
    padding: 1rem 2rem;
}
.main-content {
    margin-left: 0 !important;
}


body {
    position: relative;
    background: #7D929E;
}

body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('../img/jolly.avif');
    background-size: 600px;
    background-position: center 70%;
    background-repeat: no-repeat;
    z-index: -1;
    transform-origin: center 90%;
}

/* Mobile - card berjejer ke bawah */
@media (max-width: 768px) {
    .select-container {
        flex-direction: column;
        align-items: center;
        gap: 1rem;
    }
    
    .select-card {
        width: 90%;
        max-width: 350px;
        height: 80px;
    }
    
    .select-card h3 {
        font-size: 1rem;
    }
    
    .select-card .emoji {
        font-size: 1.5rem;
    }
    
    .select-card p {
        font-size: 0.75rem;
    }
    
    /* Background lebih transparan di mobile */
    body::before {
        opacity: 0.3;
        background-size: 400px;
        background-position: center 80%;
    }
}

    </style>
    <script src="../app.js"></script>
</head>
<body>
    <div class="main-content">
        <header class="top-bar"><h1>Pilih Tipe Kuis</h1></header>
        <div class="content">
            <div class="select-container" id="selectContainer"></div>
        </div>
    </div>
    <script>
        const params = new URL(window.location.href).searchParams;
        const lessonId = params.get('lesson') || '';
        const prefix = lessonId ? `?lesson=${lessonId}` : '';

        document.getElementById('selectContainer').innerHTML = `
    <a href="quiz.html?random=5" class="select-card mc">
        <div class="emoji">🎯</div>
        <h3>Multiple Choice</h3>
    </a>
    <a href="quiz-gap.html${prefix}" class="select-card gap">
        <div class="emoji">🧩</div>
        <h3>Gap Fill</h3>
    </a>
    <a href="quiz-kanji.html" class="select-card mc" style="border-top-color: #F3AD16;">
        <div class="emoji">漢</div>
        <h3>Kanji Quiz</h3>
    </a>
`;


</script>
</body>
</html>
